name: "Specty PR Governance Gate"
description: "Enforce specification-driven AI development governance and publish automated PR approval and bypass audit status comments."
author: "Specty Team"
branding:
  icon: "shield"
  color: "blue"

inputs:
  github-token:
    description: "GitHub API Token for PR comment posting"
    required: false
    default: ${{ github.token }}
  base-ref:
    description: "Base branch reference for diff (defaults to GITHUB_BASE_REF or origin/main)"
    required: false
    default: ""
  strict:
    description: "Strict mode failing on unapproved drafts or required re-approvals"
    required: false
    default: "false"
  lang:
    description: "Language for PR comments (en or es)"
    required: false
    default: ""

runs:
  using: "composite"
  steps:
    - name: Run Specty Gate
      shell: bash
      env:
        GITHUB_TOKEN: ${{ inputs.github-token }}
        INPUT_BASE_REF: ${{ inputs.base-ref }}
        INPUT_STRICT: ${{ inputs.strict }}
        INPUT_LANG: ${{ inputs.lang }}
      run: |
        ARGS="--comment"
        if [ -n "$INPUT_BASE_REF" ]; then
          ARGS="$ARGS --base \"$INPUT_BASE_REF\""
        fi
        if [ "$INPUT_STRICT" = "true" ]; then
          ARGS="$ARGS --strict"
        fi
        if [ -n "$INPUT_LANG" ]; then
          ARGS="$ARGS --lang \"$INPUT_LANG\""
        fi
        if [ -x "./node_modules/.bin/specty" ]; then
          ./node_modules/.bin/specty gate $ARGS
        else
          npx --no-install @barcidev/specty gate $ARGS || npx -y @barcidev/specty gate $ARGS
        fi
